  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ellie</title>
    <link rel="shortcut icon" href="/frontend/assets/img/logo.ico" type="image/x-icon">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"

      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
     <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js"
      type="text/javascript"></script>

<link rel="stylesheet" href="assets/vendore/texllate/animate.css">

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
    <section id="Oval" class="mb-4">
    <div class="row">
        <div class="col-md-1"></div>
        <div class="col-md-10">
            <div 
              class="d-flex justify-content-center align-items-center" 
              style="height:80vh;"
            >
             <canvas id="canvasOne" width="700" height="420" 
              style="position: absolute;"></canvas>  
              <div id="EllieHood">
                <div class="square">
                    <span class="span circle"></span>
                    <span class="span circle"></span>
                    <span class="span circle"></span>
                </div>
              </div>         
            </div>
            <h4 class="text-light text text-center">HELLO BOSS ASK ME ANYTHING</h4>

            <div class="col-md-12 mt-4 pt-4">
              <div class="text-center">
                <div id="TextInput" class="d-flex">
                  <input type="text" id="chatbox" name="chatbox" placeholder="Ask me anything...." class="input-field"/>
                  <button class="glow-on-hover" id="MicBtn" title="Voice Command"><i class="bi bi-mic"></i></button>
                  <button class="glow-on-hover" id="ChatBtn" title="Send Message"><i class="bi bi-chat-dots"></i></button>
                  <button class="glow-on-hover" id="ReminderBtn" onclick="openReminderModal()" title="Add Reminder"><i class="bi bi-bell"></i></button>
                  <button class="glow-on-hover" id="RemindersListBtn" onclick="toggleRemindersList()" title="View Reminders"><i class="bi bi-clock-history"></i></button>
                  <button class="glow-on-hover" id="SettingBtn" title="Settings"><i class="bi bi-gear"></i></button>
                </div>
              </div>
            </div>
        </div>
        <div class="col-md-1"></div>
    </div>
    </section>
    <div id="SiriWave" class="mb-4">
      <div class="container">
        <div class="row">
          <div class="column-md-12">
            <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
              <div class="">
              <p class="text-light mb-4 siri-message">
              </p>
              <div id="siri-container"></div>
            </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>

    <!-- ============== REMINDER MODAL ============== -->
    <div id="reminderModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); overflow: auto;">
      <div class="modal-content" style="background-color: #181818; color: white; margin: 5% auto; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; border: 2px solid #1e90ff; box-shadow: 0 0 30px rgba(30, 144, 255, 0.5); animation: slideIn 0.3s ease;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="margin: 0; color: #1e90ff; font-size: 24px;"><i class="bi bi-bell-fill" style="margin-right: 10px;"></i>Set Reminder</h2>
          <span class="close" style="font-size: 28px; font-weight: bold; cursor: pointer; color: #1e90ff; transition: color 0.3s;" onclick="closeReminderModal()" onmouseover="this.style.color='#ff1493'" onmouseout="this.style.color='#1e90ff'">&times;</span>
        </div>
        
        <hr style="border-color: #1e90ff; opacity: 0.3;">
        
        <form id="reminderForm">
          <div style="margin-bottom: 15px;">
            <label for="reminderTitle" style="display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Reminder Title <span style="color: #ff1493;">*</span></label>
            <input type="text" id="reminderTitle" placeholder="e.g., Team Meeting, Doctor Appointment" style="width: 100%; padding: 12px; border: 1px solid #1e90ff; border-radius: 5px; background-color: #111; color: white; box-sizing: border-box; font-size: 14px; transition: border-color 0.3s;" onfocus="this.style.borderColor='#ff1493'" onblur="this.style.borderColor='#1e90ff'" required>
          </div>
          
          <div style="margin-bottom: 15px;">
            <label for="reminderDesc" style="display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Description <span style="color: #999; font-weight: normal; text-transform: none; letter-spacing: normal;">(Optional)</span></label>
            <textarea id="reminderDesc" placeholder="Add additional details about your reminder..." style="width: 100%; padding: 12px; border: 1px solid #1e90ff; border-radius: 5px; background-color: #111; color: white; box-sizing: border-box; height: 70px; resize: vertical; font-size: 14px; transition: border-color 0.3s; font-family: Arial, sans-serif;" onfocus="this.style.borderColor='#ff1493'" onblur="this.style.borderColor='#1e90ff'"></textarea>
          </div>
          
          <div style="margin-bottom: 15px;">
            <label for="reminderTime" style="display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Time <span style="color: #ff1493;">*</span></label>
            <input type="time" id="reminderTime" style="width: 100%; padding: 12px; border: 1px solid #1e90ff; border-radius: 5px; background-color: #111; color: white; box-sizing: border-box; font-size: 14px; transition: border-color 0.3s; cursor: pointer;" onfocus="this.style.borderColor='#ff1493'" onblur="this.style.borderColor='#1e90ff'" required>
          </div>
          
          <div style="margin-bottom: 20px;">
            <label for="reminderRepeat" style="display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Repeat Type</label>
            <select id="reminderRepeat" style="width: 100%; padding: 12px; border: 1px solid #1e90ff; border-radius: 5px; background-color: #111; color: white; box-sizing: border-box; font-size: 14px; cursor: pointer; transition: border-color 0.3s;" onfocus="this.style.borderColor='#ff1493'" onblur="this.style.borderColor='#1e90ff'">
              <option value="once" style="background-color: #111; color: white;">Once</option>
              <option value="daily" style="background-color: #111; color: white;">Daily</option>
              <option value="weekly" style="background-color: #111; color: white;">Weekly</option>
            </select>
          </div>
          
          <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button type="button" onclick="closeReminderModal()" style="padding: 12px 25px; border: 1px solid #444; border-radius: 5px; background-color: #222; color: white; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.3s;" onmouseover="this.style.backgroundColor='#333'; this.style.borderColor='#555'" onmouseout="this.style.backgroundColor='#222'; this.style.borderColor='#444'">Cancel</button>
            <button type="submit" style="padding: 12px 25px; border: none; border-radius: 5px; background-color: #1e90ff; color: white; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.3s; box-shadow: 0 0 10px rgba(30, 144, 255, 0.5);" onmouseover="this.style.boxShadow='0 0 20px rgba(30, 144, 255, 0.8)'; this.style.backgroundColor='#0077ff'" onmouseout="this.style.boxShadow='0 0 10px rgba(30, 144, 255, 0.5)'; this.style.backgroundColor='#1e90ff'">Set Reminder</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ============== REMINDERS LIST PANEL ============== -->
    <div id="remindersList" class="reminders-panel" style="display: none; position: fixed; right: 20px; top: 100px; width: 380px; background-color: #181818; color: white; border: 2px solid #1e90ff; border-radius: 10px; padding: 20px; max-height: 600px; overflow-y: auto; z-index: 999; box-shadow: 0 0 30px rgba(30, 144, 255, 0.5); animation: slideInRight 0.3s ease;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(30, 144, 255, 0.3);">
        <h3 style="margin: 0; color: #1e90ff; font-size: 18px; display: flex; align-items: center;">
          <i class="bi bi-clock-history" style="margin-right: 10px; font-size: 20px;"></i>
          Active Reminders
        </h3>
        <span onclick="toggleRemindersList()" style="cursor: pointer; font-size: 24px; color: #1e90ff; line-height: 1; transition: color 0.3s;" onmouseover="this.style.color='#ff1493'" onmouseout="this.style.color='#1e90ff'">×</span>
      </div>
      <div id="remindersListContent" style="max-height: 500px; overflow-y: auto;">
        <p style="color: #999; text-align: center; padding: 20px 0;">Loading reminders...</p>
      </div>
    </div>

    <!-- Scrollbar styling for reminders panel -->
    <style>
      #remindersList::-webkit-scrollbar {
        width: 8px;
      }
      #remindersList::-webkit-scrollbar-track {
        background: #111;
        border-radius: 10px;
      }
      #remindersList::-webkit-scrollbar-thumb {
        background: #1e90ff;
        border-radius: 10px;
      }
      #remindersList::-webkit-scrollbar-thumb:hover {
        background: #ff1493;
      }

      #remindersListContent::-webkit-scrollbar {
        width: 6px;
      }
      #remindersListContent::-webkit-scrollbar-track {
        background: #111;
        border-radius: 10px;
      }
      #remindersListContent::-webkit-scrollbar-thumb {
        background: #1e90ff;
        border-radius: 10px;
      }
      #remindersListContent::-webkit-scrollbar-thumb:hover {
        background: #ff1493;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes slideInRight {
        from {
          opacity: 0;
          transform: translateX(100px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .reminder-item {
        background: linear-gradient(135deg, #222 0%, #1a1a1a 100%);
        padding: 15px;
        margin-bottom: 12px;
        border-radius: 8px;
        border-left: 4px solid #1e90ff;
        transition: all 0.3s ease;
      }

      .reminder-item:hover {
        border-left-color: #ff1493;
        box-shadow: inset 0 0 10px rgba(30, 144, 255, 0.2);
        transform: translateX(5px);
      }

      .reminder-item-title {
        color: #1e90ff;
        font-weight: 600;
        font-size: 15px;
        margin-bottom: 5px;
      }

      .reminder-item-time {
        color: #aaa;
        font-size: 12px;
        margin-bottom: 5px;
      }

      .reminder-item-desc {
        color: #ccc;
        font-size: 12px;
        margin-bottom: 10px;
        font-style: italic;
      }

      .reminder-button {
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        color: white;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        transition: all 0.3s;
        flex: 1;
        margin-right: 5px;
      }

      .reminder-button:last-child {
        margin-right: 0;
      }

      .reminder-button-snooze {
        background-color: #1e90ff;
      }

      .reminder-button-snooze:hover {
        background-color: #0077ff;
        box-shadow: 0 0 10px rgba(30, 144, 255, 0.5);
      }

      .reminder-button-delete {
        background-color: #ff4444;
      }

      .reminder-button-delete:hover {
        background-color: #ff0000;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
      }
    </style>
